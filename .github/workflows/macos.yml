name: Build macOS
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release -p manget_cli --target aarch64-apple-darwin
          cargo build --release -p manget_cli --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/manget_cli \
            target/aarch64-apple-darwin/release/manget_cli \
            target/x86_64-apple-darwin/release/manget_cli
          lipo -info dist/manget_cli
          tar -czf dist/manget_cli-macos-universal.tar.gz -C dist manget_cli
      - uses: actions/upload-artifact@v4
        with:
          name: manget_cli-macos
          path: dist/manget_cli-macos-universal.tar.gz
